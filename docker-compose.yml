name: cst-website

services:
  app:
    build:
      context: .
      target: runner
    image: cst-website:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Inside Docker the database is reached by its service name, not localhost.
      DATABASE_URL: postgres://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web
      - backend
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1000,gid=1000,mode=0755
    volumes:
      # Images and documents uploaded in the admin panel. Back this volume up with the database.
      - uploads:/app/storage/uploads
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-off migration job. Not started by `docker compose up`.
  #   docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: migrator
    image: cst-website-migrator:latest
    profiles: ["tools"]
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
    volumes:
      # The seed copies the homepage's initial photographs here.
      - uploads:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      # PostgreSQL 18+ images store data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
    networks:
      - backend
    # No published port: the database is only reachable from other containers.
    # For host access during development, add docker-compose.dev.yml (see README).
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  web:
  backend:
    internal: true

volumes:
  pgdata:
  uploads:
